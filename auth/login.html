<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GuessrQuiz - Log In</title>

    <link
        rel="icon"
        type="image/png"
        href="../homeImg/guessrQuizLogo.png"
    >

    <link rel="stylesheet" href="auth.css">
</head>

<body>

<main class="auth-page">

    <a href="../" class="home-button">
        <img
            src="../homeImg/guessrQuizLogo.png"
            alt=""
        >

        Home
    </a>

    <section class="auth-card">

        <div class="auth-heading">
            <div class="auth-icon">
                👤
            </div>

            <p class="auth-label">
                GUESSRQUIZ ACCOUNT
            </p>

            <h1>Welcome back</h1>

            <p>
                Log in to access your saved progress,
                XP, achievements, and profile.
            </p>
        </div>

        <form id="loginForm" novalidate>

            <label for="email">
                Email address
            </label>

            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">
                Password
            </label>

            <div class="password-field">
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    id="togglePassword"
                    class="password-toggle"
                    type="button"
                    aria-label="Show password"
                >
                    Show
                </button>
            </div>

            <div class="login-options">

                <label class="checkbox-row login-checkbox">
                    <input
                        id="rememberMe"
                        type="checkbox"
                        checked
                    >

                    <span>
                        Keep me logged in
                    </span>
                </label>

                <a href="forgot-password.html">
                    Forgot password?
                </a>

            </div>

            <div
                id="formMessage"
                class="form-message"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <button
                id="loginButton"
                class="primary-button"
                type="submit"
            >
                Log In
            </button>

        </form>

        <p class="auth-switch">
            Don’t have an account?

            <a href="register.html">
                Create one
            </a>
        </p>

    </section>

</main>

<script
    type="module"
    src="login.js"
></script>

</body>
</html>
