<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GuessrQuiz - Flag Quiz</title>

    <link
        rel="icon"
        type="image/png"
        href="../homeImg/guessrQuizLogo.png"
    >

    <link rel="stylesheet" href="../quiz-common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="quiz-wrap">

    <a href="../" class="home-button">
        <img
            src="../homeImg/guessrQuizLogo.png"
            alt=""
        >

        Home
    </a>

    <header class="quiz-header">

        <h1>🏳️ Flag Quiz</h1>

        <p>
            Match countries with their national flags.
        </p>

    </header>

    <!-- QUIZ SETTINGS -->

    <section class="controls flag-controls">

        <label>
            Difficulty

            <select id="difficulty">
                <option value="Easy">
                    Easy
                </option>

                <option value="Hard">
                    Hard
                </option>
            </select>
        </label>

        <label>
            Region

            <select id="region">
                <option value="All">
                    All Regions
                </option>

                <option value="Europe">
                    Europe
                </option>

                <option value="Asia">
                    Asia
                </option>

                <option value="Africa">
                    Africa
                </option>

                <option value="North America">
                    North America
                </option>

                <option value="South America">
                    South America
                </option>

                <option value="Oceania">
                    Oceania
                </option>
            </select>
        </label>

        <label>
            Quiz Mode

            <select id="quizMode">
                <option value="flag-country">
                    Flag → Country
                </option>

                <option value="country-flag">
                    Country → Flag
                </option>

                <option value="mixed">
                    Mixed
                </option>
            </select>
        </label>

    </section>

    <!-- STATS -->

    <section class="stats">

        <div>
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div>
            <span>Streak</span>
            <strong id="streak">0</strong>
        </div>

    </section>

    <!-- MAIN QUIZ CARD -->

    <main class="quiz-card">

        <p class="question-label">
            Choose the correct answer.
        </p>

        <img
            id="flag"
            src=""
            alt="Country flag"
        >

        <div id="question" class="flag-question">
            Loading...
        </div>

        <div id="answers" class="answers"></div>

        <div class="quiz-actions">

    <button id="next">
        Next Question
    </button>

</div>
    </main>

</div>

<!-- COMPLETION SCREEN -->

<div id="completionScreen" class="completion-screen">

    <div class="completion-card">

        <h2>🎉 Flag Quiz Complete!</h2>

        <p id="completionTitle">
            Excellent Work!
        </p>

        <div class="completion-stats">

            <div>
                <span>Score</span>
                <strong id="completeScore">
                    0 / 0
                </strong>
            </div>

            <div>
                <span>Accuracy</span>
                <strong id="completeAccuracy">
                    0%
                </strong>
            </div>

            <div>
                <span>Best Streak</span>
                <strong id="completeBest">
                    0
                </strong>
            </div>

            <div>
                <span>XP Earned</span>
                <strong id="completeXP">
                    +0 XP
                </strong>
            </div>

        </div>

        <p id="completionAchievement">
            🏳️ Flag Quiz Completed!
        </p>

        <div class="completion-buttons">

            <button id="playAgain">
                Play Again
            </button>

            <button
                type="button"
                onclick="window.location.href='../'"
            >
                Home
            </button>

            <button id="next" class="next-button">
                Next Question
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
